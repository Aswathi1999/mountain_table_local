<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Figtree:wght@300;400&display=block" rel="stylesheet">
<style>
body{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;font-size:16px}
.c{padding:28px 30px;border-right:1px solid #0002}
.dark{background:#142a21;color:#f5f0e4}.light{background:#f5f0e4;color:#1f3b2f}
.tag{font:11px monospace;opacity:.6;margin-bottom:10px}
.h{font-size:56px;line-height:1.02;letter-spacing:-.02em;margin:0 0 6px}
.h2{font-size:38px;line-height:1.1;margin:18px 0 8px}
p{margin:10px 0;font-size:17.5px;line-height:1.7;max-width:34em}
.nav{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:16px}
.q{font-size:30px;line-height:1.22;font-style:italic;margin-top:16px}
</style>
<body>
<script>
const pairs=[
["A  Cormorant Garamond + Manrope","'Cormorant Garamond'","'Manrope'",500,300,"-.01em"],
["B  Playfair Display + Inter","'Playfair Display'","'Inter'",400,300,"-.02em"],
["C  DM Serif Display + DM Sans","'DM Serif Display'","'DM Sans'",400,300,"-.01em"],
["D  Fraunces + Figtree","'Fraunces'","'Figtree'",300,300,"-.02em"],
["E  Bodoni Moda (current) + Manrope","'Bodoni Moda'","'Manrope'",400,300,"-.02em"],
["F  Cormorant Garamond + DM Sans","'Cormorant Garamond'","'DM Sans'",500,300,"-.01em"],
];
for(const [n,h,b,hw,bw,ls] of pairs){
 for(const t of ["dark","light"]){
  const d=document.createElement("div");d.className="c "+t;
  d.innerHTML=`<div class=tag>${n}</div>
  <div class=h style="font-family:${h};font-weight:${hw};letter-spacing:${ls}">Thatched elegance:<br><i>Unwind in the heart of nature</i></div>
  <div class=h2 style="font-family:${h};font-weight:${hw}">Complimentary breakfast &amp; Our rooms</div>
  <p style="font-family:${b};font-weight:${bw+100}">Nestled in the serene hills of Ulupuni, The Mountain Table offers a peaceful escape from the hustle and bustle of city life. Our homestay is a place where you can unwind, relax, and immerse yourself in the beauty of nature.</p>
  <div class=q style="font-family:${h};font-weight:${hw}">“A tranquil haven amidst nature's embrace.”</div>
  <div class=nav style="font-family:${b};font-weight:${bw+100}">Home &nbsp; About &nbsp; See &amp; Do &nbsp; Rooms &amp; Booking</div>`;
  document.body.appendChild(d);
 }
}
</script>
